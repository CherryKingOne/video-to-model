[project]
name = "video-to-model"
version = "0.1.0"
description = "Generate temporally consistent depth videos with Video Depth Anything"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.30.0",
    "numpy>=1.26",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "opencv-python>=4.9",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "einops>=0.7",
    "easydict>=1.10",
    "httpx[socks]>=0.28.1",
]

[project.scripts]
video-to-model = "video_to_model.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_to_model"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
